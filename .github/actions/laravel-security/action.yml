name: Central Laravel Security Baseline
# Rules and scripts live in this central action, not the target repository.
description: Composer audit, Gitleaks and Semgrep for Laravel repositories
runs:
  using: composite
  steps:
    - name: Setup PHP / Composer
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer:v2
        coverage: none

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install pinned Semgrep
      shell: bash
      run: python -m pip install --disable-pip-version-check --no-input 'semgrep==1.182.0'

    - name: Install checksummed Gitleaks
      shell: bash
      env:
        SECURITY_ACTION_ROOT: ${{ github.action_path }}
      run: bash "$SECURITY_ACTION_ROOT/scripts/install-gitleaks.sh"

    - name: Composer Audit (blocking)
      id: composer_audit
      shell: bash
      continue-on-error: true
      run: |
        set -euo pipefail
        test -f composer.json || { echo '::error::composer.json missing'; exit 1; }
        test -f composer.lock || { echo '::error::composer.lock missing'; exit 1; }
        composer audit --locked --abandoned=report --no-interaction

    - name: Gitleaks (working tree and PR commits; blocking)
      id: gitleaks
      shell: bash
      continue-on-error: true
      env:
        SECURITY_ACTION_ROOT: ${{ github.action_path }}
        GITLEAKS_CONFIG: ${{ github.action_path }}/config/gitleaks.toml
        PR_BASE_REF: ${{ github.base_ref }}
      run: bash "$SECURITY_ACTION_ROOT/scripts/scan-gitleaks.sh"

    - name: Semgrep ERROR (blocking)
      id: semgrep_error
      shell: bash
      continue-on-error: true
      env:
        SECURITY_ACTION_ROOT: ${{ github.action_path }}
      run: |
        set -euo pipefail
        semgrep scan --config "$SECURITY_ACTION_ROOT/config/laravel-security.yml" \
          --severity ERROR --error --strict --metrics=off \
          --exclude vendor --exclude node_modules --exclude coverage \
          --exclude public/build --exclude storage/framework \
          --exclude storage/logs --exclude bootstrap/cache .

    - name: Semgrep WARNING (advisory findings)
      id: semgrep_warning
      shell: bash
      continue-on-error: true
      env:
        SECURITY_ACTION_ROOT: ${{ github.action_path }}
      run: |
        set -euo pipefail
        semgrep scan --config "$SECURITY_ACTION_ROOT/config/laravel-security.yml" \
          --severity WARNING --strict --metrics=off \
          --exclude vendor --exclude node_modules --exclude coverage \
          --exclude public/build --exclude storage/framework \
          --exclude storage/logs --exclude bootstrap/cache .

    - name: Final Security Gate
      if: always()
      shell: bash
      env:
        COMPOSER_RESULT: ${{ steps.composer_audit.outcome }}
        GITLEAKS_RESULT: ${{ steps.gitleaks.outcome }}
        SEMGREP_ERROR_RESULT: ${{ steps.semgrep_error.outcome }}
        SEMGREP_WARNING_RESULT: ${{ steps.semgrep_warning.outcome }}
      run: |
        set -euo pipefail
        {
          echo '## Central Laravel Security CI'
          echo '| Scanner | Result | Policy |'
          echo '| --- | --- | --- |'
          echo "| Composer Audit | ${COMPOSER_RESULT:-missing} | Blocking |"
          echo "| Gitleaks | ${GITLEAKS_RESULT:-missing} | Blocking |"
          echo "| Semgrep ERROR | ${SEMGREP_ERROR_RESULT:-missing} | Blocking |"
          echo "| Semgrep WARNING | ${SEMGREP_WARNING_RESULT:-missing} | Findings advisory; runtime errors must be reviewed |"
        } >> "$GITHUB_STEP_SUMMARY"
        if [[ "$COMPOSER_RESULT" != success || "$GITLEAKS_RESULT" != success || "$SEMGREP_ERROR_RESULT" != success || "$SEMGREP_WARNING_RESULT" != success ]]; then
          echo '::error::Security gate did not pass. Review scan outputs.'
          exit 1
        fi
        echo 'Security gate PASSED.'
